<main class="page" id="scratch" hidden> <!-- the page box -->
  <div class="ptitle"> 
    <a class="back" href="#/projects" aria-label="Back">&lt;</a> 
    <h2 data-th="โปรเจกต์เกมจากโปรแกรม Scratch" data-en="Scratch Game"></h2> 
  </div>
  <div class="pbody"> <!-- the content box -->
    <div class="shots c3"> <!-- a row of 3 pictures -->
      <img src="Pictures/wait.png" alt="" style="--r:4/3"> 
      <img src="Pictures/wait.png" alt="" style="--r:4/3"> 
      <img src="Pictures/wait.png" alt="" style="--r:4/3"> 
    </div>
    <p class="ptext" data-th="เกมนี้เป็นเกมที่สร้างขึ้นโดยใช้โปรแกรม Scratch โดยมีวัตถุประสงค์เพื่อฝึกกระบวนการคิดเชิงตรรกะ (Computational Thinking) เรียนรู้หลักการทำงานพื้นฐานของการพัฒนาเกม ซึ่งถือเป็นโครงสร้างพื้นฐานสำคัญในการต่อยอดสู่การพัฒนาซอฟต์แวร์และเกมที่ซับซ้อนขึ้นในอนาคต โดยเกมนี้เป็นเกมสำหรับทุกวัย มีเนื้อหาหลักคือการปกป้องดอกไม้ ให้ผู้เล่นบริหารจัดการมานาและเวลาให้พอดี เพื่อกำจัดมอนสเตอร์ที่จะสุ่มเกิด เพื่อไม่ให้ดอกไม้ตาย เป็นการฝึกฝนทักษะการบริหารจัดการรูปแบบหนึ่ง" data-en="This game was created using Scratch to practice computational thinking and learn the basic principles of game development, serving as a foundation for building more complex games and software in the future. Suitable for players of all ages, the main goal is to protect a flower from randomly spawned monsters. Players must manage their mana and time efficiently to defeat the monsters before the flower dies, helping to practice real-world resource management skills."></p> 
    <div class="pmix" style="--cols:1.15fr 1fr"> <!-- bottom row: picture on the left, text on the right (column ratio 1.15 : 1) -->
      <img class="shot" src="Pictures/wait.png" alt="" style="--r:1.9/1"> <!-- left picture, shape 1.9:1 -->
      <div class="side"> <!-- right column -->
        <p class="ptext" data-th="ในตอนนี้เกมนี้สามารถเข้าไปเล่นได้ในเว็บไซต์ของ Scratch โดยสามารถเล่นได้เฉพาะบนคอมพิวเตอร์เท่านั้น ซึ่งจะมีแนะนำวิธีการเล่นและปุ่มควบคุมต่าง ๆ ระบุไว้อย่างชัดเจน เพื่อให้ผู้เล่นสามารถเข้าใจระบบเกมและเล่นได้อย่างราบรื่น" data-en="Currently, this game is playable on the Scratch website for PC / Desktop only. You can find instructions and control guides to help players easily understand the gameplay and start playing right away."></p> <!-- text on the right -->

<main class="page" id="math" hidden>

  <div class="pbody"> <!-- the content box -->

    <div class="shots c3" style="--g:.4rem"> <!-- a row of 3 pictures with a small gap (--g = gap) -->
      <img src="Pictures/wait.png" alt="" style="--r:1.85/1"> 
      <img src="Pictures/wait.png" alt="" style="--r:1.85/1"> 
      <img src="Pictures/wait.png" alt="" style="--r:1.85/1"> 
    </div>
    <p class="ptext" data-th="ในเกมนี้ มีทั้งหมดสามด่าน ซึ่งแต่ละด่านก็จะมีฉากและพื้นหลังที่แตกต่างกัน มีมอนสเตอร์ที่แตกต่างกันไปหลากหลายรูปแบบ และมีชุดคำถามที่แตกต่างกัน โดยรูปแบบคำถามจะยากขึ้นตามระดับเพื่อเพิ่มความท้าทายให้ผู้เล่น และเพื่อช่วยให้ผู้เล่นจดจำเนื้อเรื่องสถิติศาสตร์ได้มากขึ้นผ่านการฝึกทำโจทย์" data-en="In this game, there are three stages in total. Each stage has different scenes and backgrounds, various types of different monsters, and different question sets. The question formats get harder according to the levels to increase the challenge for players and to help players remember the Statistics lesson more through practicing problems."></p> <!-- paragraph 2 -->
    <div class="pmix" style="--cols:.9fr 1fr"> <!-- bottom row: picture left, text right -->
      <img class="shot" src="Pictures/wait.png" alt="" style="--r:1.66/1"> <!-- final stage picture -->
      <div class="side"> <!-- right column -->
        <p class="ptext" data-th="เมื่อผู้เล่นเล่นผ่านครบทั้งสามด่าน ก็จะสามารถเข้าไปยังด่านสุดท้าย ในด่านนี้จะเป็นการสู้กับมอนสเตอร์ที่แข็งแกร่ง ผู้เล่นจะต้องตอบคำถามให้ครบตามจำนวนเพื่อชนะเกม โดยชุดคำถามในด่านนี้ จะเป็นชุดคำถามที่มีคำถามระดับสูงที่ยากกว่าคำถามอื่น ๆ รวมอยู่ด้วย" data-en="When players pass all three stages, they can go to the final stage. In this stage, It is a battle with a strong monster. Players must answer the questions completely to win the game. The question set in this stage includes high level questions that are harder than other questions."></p> <!-- paragraph 3 -->
        <a class="gobtn" href="https://gd.games/instant-builds/a2bfc202-268c-492b-9d3e-7e39f98f7945" target="_blank" rel="noopener">Math Game<img src="Pictures/Click.png" alt=""></a> <!-- button to play the game -->
      </div>
    </div>
  </div>
</main>
