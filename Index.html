<!DOCTYPE html>

<html lang="th"> 
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <!-- can open in phone -->
<title>Portfolio</title> 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet"> <!-- use fonts Bai Jamjuree (Eng) , Kanit (Th) -->
<link rel="stylesheet" href="style.css">
</head>

<body> 
<header class="bar"> <!-- top bar -->
  <span class="brand">PORTFOLIO</span> 
  <nav class="socials" aria-label="Social links">
    <a href="https://www.facebook.com/profile.php?id=61573266497405" target="_blank" rel="noopener" aria-label="Facebook"><img src="Pictures/Facebook.jpg" alt=""></a>
    <a href="https://www.instagram.com/mim_15106/" target="_blank" rel="noopener" aria-label="Instagram"><img src="Pictures/Instagram.jpg" alt=""></a> 
    <a href="https://www.tiktok.com/@rawi.dp?is_from_webapp=1&amp;sender_device=pc" target="_blank" rel="noopener" aria-label="TikTok"><img src="Pictures/TikTok.jpg" alt=""></a> 
    <button id="emailBtn" class="email" type="button" hidden>email</button> 
  </nav>
  <span class="sp"></span>
  <a id="homeLink" href="#/home" data-th="กลับหน้าหลัก" data-en="Home" hidden></a>
  <button id="lang" type="button" aria-label="Change language / เปลี่ยนภาษา"><img id="langImg" alt=""></button> 
</header> 

<main class="page" id="home"> <!-- home page -->
  <section class="intro">
    <img src="Pictures/Portrait.jpg" alt=""> <!-- ❗ Don't forgot to change picture ❗ -->
    <div class="who"> 
      <h1> 
        <span class="first" data-th="รวิสรา" data-en="Rawissara"></span> 
        <span class="last" data-th="สุดสงวน" data-en="Sudsanguan"></span> 
      </h1> 
      <a class="btn" href="#/portfolio" data-th="ดูเพิ่มเติม" data-en="View more"></a> 
    </div>
  </section> 
</main>

<main class="page" id="portfolio" hidden> <!-- portfolio page (hide, will show when click button) -->
  <h1 class="big" data-th="แฟ้มสะสมผลงาน" data-en="Portfolio"></h1> 
  <div class="duo"> <!-- the box holding the two big panels -->
    <a class="panel" href="#/about" style="--c:#0a0f1a; --img:url(Pictures/LeftPicture.png)"><span data-th="ประวัติส่วนตัว" data-en="About Me"></span></a> 
    <a class="panel" href="#/projects" style="--c:#000; --img:url(Pictures/RightPicture.png)"><span data-th="ผลงานและโครงงาน" data-en="Projects"></span></a> 
  </div> 
</main> 

<main class="page" id="about" hidden> <!-- About me page -->
  <div class="ptitle"> 
    <a class="back" href="#/portfolio" aria-label="Back">&lt;</a> <!-- "<"  -->
    <h2 data-th="ประวัติส่วนตัว" data-en="About me"></h2> 
  </div> 
  <section class="about"> <!-- photo left, info right -->
    <img src="Pictures/Photo.jpg" alt=""> <!-- photo -->
    <div class="info"> <!-- info column -->
      <dl> 
        <dt data-th="ชื่อ :" data-en="Name :"></dt> 
        <dd data-th="นางสาวรวิสรา สุดสงวน" data-en="Rawissara Sudsanguan"></dd> 
        <dt data-th="ชื่อเล่น :" data-en="Nickname :"></dt> 
        <dd data-th="มิ้ม" data-en="Mim"></dd> 
        <dt data-th="โรงเรียน :" data-en="School :"></dt> 
        <dd data-th="เซนต์เทเรซา" data-en="Saint Theresa"></dd>
      </dl> 
      <h3 data-th="ทักษะการใช้โปรแกรม" data-en="Software proficiency"></h3> 
      <!-- skill-level ( 0-5 more in js) -->
      <div class="sw"><span>Roblox Studio</span><div class="meter" data-level="5"></div></div> 
      <div class="sw"><span>Godot</span><div class="meter" data-level="4"></div></div>
      <div class="sw"><span>Unity</span><div class="meter" data-level="3"></div></div> 
      <div class="sw"><span>Blender</span><div class="meter" data-level="2"></div></div> 
      <div class="sw"><span>Figma</span><div class="meter" data-level="3"></div></div> 
      <div class="skills"> <!-- the Additional Skills group -->
        <h3 data-th="ความสามารถเพิ่มเติม" data-en="Additional Skills"></h3> 
        <p class="skillline" data-th="การวาดรูป | การออกแบบ | การสื่อสารเพื่อประสานงาน" data-en="Drawing | Design | Communication"></p> 
      </div> 
    </div>
  </section> 
</main>


<main class="page" id="projects" hidden> <!-- Projects page -->
  <div class="ptitle">
    <a class="back" href="#/portfolio" aria-label="Back">&lt;</a> <!-- "<" button -->
    <h2 data-th="ผลงานและโครงงาน" data-en="Projects"></h2> <!-- page title -->
  </div> 
  <div class="herowrap"> <!-- wrapper around the banner so the arrow button can sit on its bottom-right corner (a button cannot be nested inside a link in valid HTML) -->
    <a class="hero" href="#/project"> <!-- the Robot Bartender banner, unchanged -->
      <span class="himg"><img class="bg" src="Pictures/RobotBartender.gif" alt=""></span> <!-- picture on the left -->
      <span class="txt"> <!-- dark text panel on the right -->
        <small data-th="โครงงานนวัตกรรม" data-en="Innovation Project"></small> <!-- small line -->
        <b>Robot Bartender</b> <!-- project name -->
        <p data-th="นวัตกรรมนี้พัฒนาขึ้นเพื่อเพิ่มประสิทธิภาพในด้านความรวดเร็วและความแม่นยำในการเตรียมเครื่องดื่ม" data-en="This innovation was developed to improve efficiency in terms of speed and accuracy in beverage preparation."></p> 
      </span>
    </a>
    <button class="dl" id="dlBtn" type="button" aria-label="Scroll down"><img src="Pictures/GoDown.png" alt=""></button> <!-- white arrow button bounces up and down, click = scrolls to the bottom , more in JS -->
  </div> <!-- end of the wrapper -->
  <div class="cards" id="cards"></div> 
    <a class="webbar" href="#/web"> 
      <span data-th="เว็บไซต์พอร์ตโฟลิโอ" data-en="Portfolio Website"></span> 
      <img src="Pictures/Github.png" alt="">
    </a>
</main> 

<!-- blank page (of each projects) ========== -->
<main class="page" id="project" hidden> 
  <div class="ptitle"><a class="back" href="#/projects" aria-label="Back">&lt;</a></div> <!-- only a "<" button, which goes back to the Projects page -->
</main>

<script src="script.js"></script>
</body>
</html>
