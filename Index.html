<main class="page" id="project" hidden>
  <div class="ptitle"> 
    <a class="back" href="#/projects" aria-label="Back">&lt;</a> 
    <h2>Robot Bartender</h2> 
    <span class="plogo"><img src="Pictures/RobotBartenderIcon.png" alt=""></span>
  </div>
  <div class="pbody"> 

    <div class="pmix indent" style="--cols:.72fr 1fr"> 
      <img class="shot" src="Pictures/Machine.jpg" alt="" style="--r:.67/1"> <!-- photo of the machine screen (replace wait.png later) -->
      <div class="side"> 
        <p class="ptext" data-th="บาร์เทนเดอร์ (Bartender) คือ ผู้เชี่ยวชาญในการผสมเครื่องดื่มทั้งแบบที่มีแอลกอฮอล์และไม่มีแอลกอฮอล์ โดยทั่วไปจะทำงานในบาร์ ร้านอาหาร หรือสถานบันเทิง ซึ่งหน้าที่หลักของบาร์เทนเดอร์นั้นนอกจากต้องผสมเครื่องดื่มแล้วยังต้องดูแลลูกค้าและความเรียบร้อยของร้านด้วย จากที่กล่าวไปบาร์เทนเดอร์ต้องทำงานหลายส่วนพร้อมกัน ดังนั้นนวัตกรรมนี้จึงตอบโจทย์การแก้ปัญหา โดยนวัตกรรมนี้จะช่วยแบ่งเบาภาระงานของบาร์เทนเดอร์ เนื่องจากสามารถทำเครื่องดื่มได้ในเวลาไม่นานและมีเมนูที่หลากหลาย อีกทั้งลูกค้ายังสามารถจ่ายเงินได้แบบออนไลน์ซึ่งทั้งสะดวกและรวดเร็ว" data-en="Bartender is a professional who makes drinks, both with and without alcohol, usually working in bars or restaurants. Besides mixing drinks, bartenders also have to take care of customers and keep the place running smoothly. Because they have to do many things at once, this project helps solve that problem by making drinks quickly with many menu options, and customers can pay online easily and fast."></p> 
      </div>
    </div>

    <div class="pmix" style="--cols:1fr 1fr"> 
      <div class="side"> <!-- left column -->
        <p class="ptext" data-th="โครงงานชิ้นนี้ได้รับการออกแบบเพื่อให้สามารถผลิตเครื่องดื่มตามการตั้งค่าที่กำหนดไว้ และสามารถกำหนดส่วนผสมเครื่องดื่มได้ตามผู้ใช้ต้องการ และมีหน้าจอแสดงผลที่สวยงามเพื่อเพิ่มความน่าสนใจในการใช้ โดยนวัตกรรมนี้สามารถผลิตเครื่องดื่มได้หนึ่งแก้วภายในสามนาทีหลังจากการจ่ายเงิน ทั้งนี้เครื่องนี้รองรับการชำระเงินเฉพาะทางออนไลน์เท่านั้น" data-en="This project is designed to make drinks based on set recipes or custom choices made by the user, with an attractive screen to catch people's attention. The machine can make one cup of drink within three minutes after payment and it only accepts online payments."></p> 
      </div>
      <img class="shot" src="Pictures/Boots.jpg" alt="" style="--r:1.76/1"> <!-- photo of people at the booth -->
    </div>

    <div class="pmix" style="--cols:.9fr 1.2fr"> <!-- row 3: cup photo + caption on the left, two paragraphs on the right -->
      <figure class="fig"> <!-- photo + caption -->
        <img src="Pictures/Drink.jpg" alt="" style="--r:.93/1"> <!-- photo of the drink -->
        <figcaption class="cap" data-th="ภาพเพื่อการตกแต่ง ตัวเครื่องจริงมีข้อจำกัด สามารถทำได้เพียงเครื่องดื่ม ไม่สามารถใส่หลอดและฝาครอบแก้วดังภาพได้" data-en="The image is for decoration only. The actual machine has limitations and can only make drinks, it cannot add straws or lids as shown in the picture."></figcaption> <!-- small caption under the photo -->
      </figure>
      <div class="side"> <!-- right column -->
        <p class="ptext" data-th="นวัตกรรมชิ้นนี้ ใช้ภาษา Java ในการเขียนระบบหลัก ผสมกับภาษา Python ที่นำมาเป็นตัวช่วยในการสั่งการการทำงานของเครื่อง โดยมีระบบการทำงานหลักคือใช้ภาษา Java ในการทำงานของหน้าจอ บริหารจัดการหน้าจอประมวลผล , รับค่าการกดเลือก คำนวณปริมาณสัดส่วนเครื่องดื่ม และการสั่งการไปยังไมโครคอนโทรลเลอร์ รวมถึงการสั่งการไปยัง Python เพื่อให้ Python ควบคุมการทำงานของรีเลย์เพื่อควบคุมปริมาณการปล่อยน้ำเชื่อมและโซดาที่ใช้ในการทำเครื่องดื่มแต่ละแก้ว" data-en="This project uses Java for the main system and Python to help control the machine. Java handles the screen display, processes user choices, calculates drink portions, and sends commands to the microcontroller and Python. Then, Python controls the relays to release the right amount of syrup and soda for each drink."></p> <!-- paragraph 3 -->
        <p class="ptext" data-th="ในส่วนของโครงสร้างภายนอก เครื่องนี้ใช้อลูมิเนียมโปรไฟล์และแผ่นอะคริลิกทึบในการขึ้นโครง ส่วนล่างของเครื่องใช้เก็บคอมพิวเตอร์ที่ใช้ในการประมวลผล ส่วนบนสุดเป็นพื้นที่เก็บน้ำเชื่อมและโซดา และตรงกลางด้านบนเป็นวงจรที่มีตัวหลักคือรีเลย์และโซลินอยด์สำหรับควบคุมปริมาณการปล่อยน้ำเชื่อมและโซดาที่จะใช้ในเครื่องดื่มแต่ละแก้ว ซึ่งควบคุมโดยไมโครคอนโทรลเลอร์ และส่วนด้านหน้าสุดเป็นหน้าจอสัมผัสและแสดงผลสำหรับตอบโต้กับลูกค้า และยังมีช่องรับเครื่องดื่มที่ตรงกลางตัวเครื่อง" data-en="For the outside structure, the machine is built with aluminum profiles and solid acrylic sheets. The bottom part stores the computer, the top part holds the syrups and soda, and the middle area contains the circuit with relays and solenoids controlled by a microcontroller. The front has a touchscreen for customers to use, and there is a dispensing slot right in the middle."></p> <!-- paragraph 4 -->
      </div>
    </div>

    <p class="ptext" data-th="จากการทำโครงงานชิ้นนี้ ได้เรียนรู้ทักษะการประสานงาน ทักษะด้านวิศวกรรม และทักษะการเขียนโปรแกรมที่สำคัญ ไม่ว่าจะเป็นการใช้ภาษา Java ร่วมกับ Python ในการควบคุมระบบฮาร์ดแวร์และซอฟต์แวร์, การออกแบบส่วนติดต่อผู้ใช้ (UI/UX) สำหรับหน้าจอสัมผัส, ตลอดจนกระบวนการออกแบบโครงสร้างทางวิศวกรรมและการประกอบวงจรไฟฟ้า เพื่อสร้างนวัตกรรมที่สามารถใช้งานได้จริงในชีวิตประจำวันเชิงธุรกิจ" data-en="Working on this project helped me learn coordination, engineering, and important programming skills, such as using Java and Python together to control hardware and software, designing touchscreen UI/UX, and building structures and electronic circuits to create a real-world innovation."></p> <!-- paragraph 5 (full width) -->
